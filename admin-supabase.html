<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin Mas Fajar Mie Ayam Kartotiyasan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>window.supabase||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase-js/2.39.3/umd/supabase.min.js"><\/script>')</script>
<style>
:root{
  color-scheme:light;
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#17261E; --muted:#5B6C62; --line:#DCE2D9;
  --green:#2E6B4F; --on-green:#FFFFFF; --red:#C62828; --yellow:#E8B93C; --yellow-bg:#FBF0CC; --yellow-ink:#5C4500;
  --green-bg:#DCEEE4; --green-ink:#1F4D3A; --red-bg:#F8DEDE; --grey-bg:#E7EAE5;
  --side:#1F3A2D; --side-ink:#E6EFE9; --side-muted:#9DB8A9; --side-active:#2E5A44;
  --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --bg:#101713; --surface:#18221C; --ink:#E7EFEA; --muted:#9BABA1; --line:#2A3830;
    --green:#5DB88C; --on-green:#0B1410; --red:#EF6B6B; --yellow:#E8B93C; --yellow-bg:#3A3217; --yellow-ink:#F1D98A;
    --green-bg:#1F3A2D; --green-ink:#A9DCC0; --red-bg:#3F2020; --grey-bg:#26312B;
    --side:#0B120E; --side-ink:#E6EFE9; --side-muted:#86A092; --side-active:#1D3026;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .logo{font-size:28px;line-height:1}
.brand b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--side-muted)}
.nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;position:relative}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--side-active);box-shadow:inset 3px 0 0 var(--yellow)}
.nav .ic{width:20px;text-align:center}
.nav .dot{background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:0 6px;margin-left:auto;line-height:18px}
.side .foot{margin-top:auto;display:grid;gap:6px}
.side .foot a,.side .foot button{color:var(--side-muted);font-size:13px;background:none;border:0;text-align:left;padding:8px 12px;cursor:pointer;text-decoration:none;border-radius:8px}
.side .foot a:hover,.side .foot button:hover{background:var(--side-active);color:var(--side-ink)}
.main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1100px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.head h2{font-size:28px}
.head p{margin:4px 0 0;color:var(--muted)}

.btn{background:var(--green);color:var(--on-green);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--grey-bg)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
label.f{display:grid;gap:5px;font-weight:500;font-size:14px;margin-bottom:12px}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted);font-weight:400}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:18px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .n{font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:3fr 2fr;gap:16px;margin-top:16px}
.pad{padding:18px 20px}
.pad h3{font-size:18px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;background:var(--green);border-radius:5px 5px 0 0;min-height:3px}
.bar.today i{background:var(--red)}
.bar span{font-size:12px;color:var(--muted)}
.bar em{font-style:normal;font-size:11px;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rank li{display:flex;justify-content:space-between;gap:10px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .em{font-size:28px;width:40px;text-align:center}
.item h4{margin:0;font-size:16px}
.item p{margin:2px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.price{font-weight:600;white-space:nowrap}
.off{opacity:.55}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600}
.b-Baru,.b-Menunggu{background:var(--yellow-bg);color:var(--yellow-ink)}
.b-Diproses{background:var(--green-bg);color:var(--green-ink)}
.b-Selesai,.b-Tampil{background:var(--green);color:var(--on-green)}
.b-Batal,.b-Disembunyikan{background:var(--grey-bg);color:var(--muted)}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.switch span{position:absolute;inset:0;background:var(--grey-bg);border:1px solid var(--line);border-radius:99px;transition:.15s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:.15s}
.switch input:checked + span{background:var(--green);border-color:var(--green)}
.switch input:checked + span::after{left:20px;background:var(--on-green)}
.switch input:focus-visible + span{outline:3px solid var(--yellow);outline-offset:2px}
.ord{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.ord:last-child{border-bottom:0}
.ord .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.ord .meta{color:var(--muted);font-size:14px}
.stars{color:#D49A00;letter-spacing:1px}
.qty{display:grid;grid-template-columns:1fr 86px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.qty:last-child{border-bottom:0}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:17px;padding-top:12px}
.src{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}

dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,14,.55)}
dialog form{padding:22px}
dialog h3{font-size:21px;margin-bottom:14px}
.dbody{max-height:62vh;overflow:auto;padding:2px 4px 2px 2px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-weight:500;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#login{position:fixed;inset:0;background:var(--side);display:grid;place-items:center;padding:20px;z-index:40}
#login .box{background:var(--surface);border-radius:16px;padding:30px;width:min(400px,100%)}
#login .box .logo{font-size:40px}
#login h1{font-size:24px;margin:8px 0 4px}
#login p{margin:0 0 18px;color:var(--muted)}
#login code{background:var(--grey-bg);padding:1px 6px;border-radius:5px;font-size:13px}
.err{color:var(--red);font-size:14px;min-height:20px;margin:6px 0}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:20;gap:0;justify-content:space-around}
  .brand,.side .foot{display:none}
  .nav{display:flex;width:100%}
  .nav button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 2px;text-align:center;align-items:center;justify-content:center}
  .nav button[aria-current="page"]{box-shadow:inset 0 3px 0 var(--yellow)}
  .nav .dot{position:absolute;top:2px;right:8px;margin:0}
  .main{padding-bottom:96px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .two{grid-template-columns:1fr}
  .item{grid-template-columns:auto 1fr}
  .item .acts{grid-column:1 / -1;justify-content:flex-start}
  .row2{grid-template-columns:1fr}
  .head h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="login">
  <div class="box" id="loginBox"></div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><span class="logo">🍜</span><div><b>Mas Fajar</b><span>Panel admin</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <a href="https://mie-ayam-kartotiyasan-mas-fajar.vercel.app" target="_blank" rel="noopener">Buka website</a>
      <button onclick="logout()">Keluar</button>
    </div>
  </aside>
  <main class="main" id="main"><div class="empty">Memuat data…</div></main>
</div>

<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div class="dbody" id="dlgBody"></div>
    <div class="dfoot">
      <button type="button" class="btn ghost" onclick="dlg.close()">Batal</button>
      <button type="submit" class="btn" id="dlgSubmit">Simpan</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= KONFIGURASI =================
   Isi dari Supabase Dashboard > Project Settings > API.
   Anon key aman ditaruh di sini karena akses dijaga Row Level Security. */
const SUPABASE_URL      = 'https://vaupynrxlcbynzgleeph.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_uOfT4jN5oRYiekB7_BrkNw_V5YojbyS';
/* =============================================== */

const configured = !SUPABASE_URL.startsWith('GANTI') && !SUPABASE_ANON_KEY.startsWith('GANTI') && window.supabase;
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const dayKey=t=>new Date(t).toLocaleDateString('sv-SE');
const fmtTime=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const waNum=n=>{n=String(n||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);return n};
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const CATS=['Andalan','Pelengkap','Minuman'];
const STATUS=['Baru','Diproses','Selesai','Batal'];

let S={menu:[],orders:[],testi:[],warung:{}};
let view='dash', mfilter='Semua', ofilter='Semua', channel=null, ready=false;

/* ---------- data ---------- */
async function loadAll(){
  const [m,o,t,w]=await Promise.all([
    sb.from('menu').select('*').order('urutan').order('nama'),
    sb.from('orders').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('testimoni').select('*').order('created_at',{ascending:false}),
    sb.from('warung').select('*').eq('id',1).maybeSingle()
  ]);
  const bad=[m,o,t,w].find(r=>r.error);
  if(bad){toast('Gagal memuat data: '+bad.error.message);return}
  S.menu=(m.data||[]).sort((a,b)=>CATS.indexOf(a.kategori)-CATS.indexOf(b.kategori)||a.urutan-b.urutan||a.nama.localeCompare(b.nama));
  S.orders=o.data||[];S.testi=t.data||[];S.warung=w.data||{};
  ready=true;
}
async function run(promise,okMsg){
  const {error}=await promise;
  if(error){toast('Gagal: '+error.message);return false}
  await loadAll();render();if(okMsg)toast(okMsg);return true;
}

/* ---------- dialog ---------- */
const dlg=$('#dlg'), dlgForm=$('#dlgForm');
function modal(title,html,onSubmit,label='Simpan',after,danger){
  $('#dlgTitle').textContent=title;
  $('#dlgBody').innerHTML=html;
  const b=$('#dlgSubmit'); b.textContent=label; b.className='btn'+(danger?' danger':'');
  dlgForm.onsubmit=e=>{e.preventDefault(); if(onSubmit(new FormData(dlgForm))!==false) dlg.close();};
  dlg.showModal();
  if(after) after();
}
function ask(msg,onYes,label='Hapus'){modal('Konfirmasi',`<p style="margin:0">${esc(msg)}</p>`,()=>{onYes()},label,null,true)}

/* ---------- login ---------- */
function showLogin(msg=''){
  $('#app').hidden=true;$('#login').style.display='grid';
  if(!configured){
    $('#loginBox').innerHTML=`<div class="logo">🍜</div><h1>Belum terhubung ke Supabase</h1>
      <p>Buka file <code>admin-supabase.html</code>, lalu isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> di bagian atas skrip.${window.supabase?'':' Library Supabase juga gagal dimuat, periksa koneksi internet.'}</p>`;
    return;
  }
  $('#loginBox').innerHTML=`<div class="logo">🍜</div><h1>Admin Mas Fajar</h1><p>Masuk dengan akun admin untuk mengelola warung.</p>
    <label class="f">Email<input type="email" id="em" autocomplete="username"></label>
    <label class="f">Kata sandi<input type="password" id="pw" autocomplete="current-password"></label>
    <div class="err" id="loginErr" role="alert">${esc(msg)}</div>
    <button class="btn" style="width:100%" id="loginBtn" onclick="doLogin()">Masuk</button>`;
  $('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
}
async function doLogin(){
  const btn=$('#loginBtn'),err=$('#loginErr');btn.disabled=true;err.textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error){err.textContent='Email atau kata sandi salah.';btn.disabled=false;return}
  await enter();
}
async function enter(){
  const {data:ok}=await sb.rpc('is_admin');
  if(!ok){await sb.auth.signOut();showLogin('Akun ini tidak terdaftar sebagai admin.');return}
  $('#login').style.display='none';$('#app').hidden=false;
  await loadAll();render();listen();
}
async function logout(){if(channel){sb.removeChannel(channel);channel=null}await sb.auth.signOut();ready=false;showLogin()}
function listen(){
  if(channel)return;
  const refresh=msg=>async()=>{await loadAll();render();toast(msg)};
  channel=sb.channel('live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},refresh('Pesanan baru masuk'))
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'testimoni'},refresh('Testimoni baru menunggu persetujuan'))
    .subscribe();
}

/* ---------- navigasi ---------- */
const NAV=[['dash','📊','Ringkasan'],['orders','🧾','Pesanan'],['menu','🍜','Menu'],['testi','💬','Testimoni'],['set','⚙️','Pengaturan']];
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  const badge={orders:S.orders.filter(o=>o.status==='Baru').length,testi:S.testi.filter(t=>t.status==='Menunggu').length};
  $('#nav').innerHTML=NAV.map(([k,i,l])=>`<button ${k===view?'aria-current="page"':''} onclick="go('${k}')"><span class="ic">${i}</span>${l}${badge[k]?`<span class="dot" aria-label="${badge[k]} baru">${badge[k]}</span>`:''}</button>`).join('');
  $('#main').innerHTML=({dash:vDash,orders:vOrders,menu:vMenu,testi:vTesti,set:vSet})[view]();
}

/* ---------- ringkasan ---------- */
function vDash(){
  const today=dayKey(Date.now());
  const valid=S.orders.filter(o=>o.status!=='Batal');
  const tOrders=S.orders.filter(o=>dayKey(o.created_at)===today);
  const tRev=tOrders.filter(o=>o.status!=='Batal').reduce((a,o)=>a+o.total,0);
  const baru=S.orders.filter(o=>o.status==='Baru').length;
  const wait=S.testi.filter(t=>t.status==='Menunggu').length;
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=dayKey(d);
    return {label:d.toLocaleDateString('id-ID',{weekday:'short'}),sum:valid.filter(o=>dayKey(o.created_at)===k).reduce((a,o)=>a+o.total,0),today:i===6}});
  const max=Math.max(...days.map(d=>d.sum),1);
  const cnt={};valid.forEach(o=>(o.items||[]).forEach(i=>cnt[i.nama]=(cnt[i.nama]||0)+i.qty));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `
  <div class="head"><div><h2>Ringkasan</h2><p>${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p></div>
    <button class="btn" onclick="orderForm()">Catat pesanan</button></div>
  <div class="panel stats">
    <div class="stat"><div class="n">${tOrders.length}</div><div class="l">Pesanan hari ini</div></div>
    <div class="stat"><div class="n">${rp(tRev)}</div><div class="l">Pendapatan hari ini</div></div>
    <div class="stat"><div class="n">${baru}</div><div class="l">Pesanan belum diproses</div></div>
    <div class="stat"><div class="n">${wait}</div><div class="l">Testimoni menunggu</div></div>
  </div>
  <div class="two">
    <div class="panel pad"><h3>Pendapatan 7 hari terakhir</h3>
      <div class="bars">${days.map(d=>`<div class="bar ${d.today?'today':''}" title="${rp(d.sum)}"><em>${d.sum?Math.round(d.sum/1000)+'rb':''}</em><i style="height:${Math.max(d.sum/max*100,2)}%"></i><span>${d.label}</span></div>`).join('')}</div>
    </div>
    <div class="panel pad"><h3>Menu terlaris</h3>
      ${top.length?`<ul class="rank">${top.map(([n,q])=>`<li><span>${esc(n)}</span><b>${q} porsi</b></li>`).join('')}</ul>`:`<div class="empty" style="padding:20px 0"><b>Belum ada data</b>Menu terlaris muncul setelah pesanan dicatat.</div>`}
    </div>
  </div>`;
}

/* ---------- menu ---------- */
function vMenu(){
  const list=S.menu.filter(m=>mfilter==='Semua'||m.kategori===mfilter);
  return `
  <div class="head"><div><h2>Menu</h2><p>${S.menu.length} menu, ${S.menu.filter(m=>m.tersedia).length} tersedia. Perubahan langsung tampil di website.</p></div>
    <button class="btn" onclick="menuForm()">Tambah menu</button></div>
  <div class="chips">${['Semua',...CATS].map(c=>`<button class="chip" aria-pressed="${mfilter===c}" onclick="mfilter='${c}';render()">${c}</button>`).join('')}</div>
  <div class="panel">${list.length?list.map(m=>`
    <div class="item ${m.tersedia?'':'off'}">
      <div class="em">${m.image?`<img src="${esc(m.image)}" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:8px">`:esc(m.emoji||'🍽️')}</div>
      <div><h4>${esc(m.nama)} <span class="hint">${esc(m.kategori)}${m.badge?', '+esc(m.badge):''}</span></h4><p>${esc(m.deskripsi)}</p></div>
      <div class="acts">
        <span class="price">${rp(m.harga)}</span>
        <label class="switch" title="Tersedia"><input type="checkbox" ${m.tersedia?'checked':''} aria-label="Tersedia: ${esc(m.nama)}" onchange="toggleMenu('${m.id}')"><span></span></label>
        <button class="btn ghost sm" onclick="menuForm('${m.id}')">Ubah</button>
        <button class="btn ghost sm" onclick="delMenu('${m.id}')">Hapus</button>
      </div>
    </div>`).join(''):`<div class="empty"><b>Belum ada menu di kategori ini</b>Tambah menu pertama dengan tombol di kanan atas.</div>`}</div>`;
}
function menuForm(id){
  const m=S.menu.find(x=>x.id===id)||{nama:'',kategori:'Andalan',harga:'',emoji:'🍜',deskripsi:'',badge:'',image:'',tersedia:true};
  modal(id?'Ubah menu':'Tambah menu',`
    <label class="f">Nama menu<input type="text" name="nama" required value="${esc(m.nama)}"></label>
    <div class="row2">
      <label class="f">Kategori<select name="kategori">${CATS.map(c=>`<option ${c===m.kategori?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="f">Harga (Rp)<input type="number" name="harga" min="0" step="500" required value="${esc(m.harga)}"></label>
    </div>
    <label class="f">Emoji<input type="text" name="emoji" maxlength="4" value="${esc(m.emoji)}"></label>
    <label class="f">Label di kartu menu <span class="hint">(opsional, contoh: Favorit)</span><input type="text" name="badge" value="${esc(m.badge)}"></label>
    <label class="f">Link foto <span class="hint">(opsional, alamat gambar https://...)</span><input type="text" name="image" value="${esc(m.image)}"></label>
    <label class="f">Deskripsi<textarea name="deskripsi">${esc(m.deskripsi)}</textarea></label>
    <label class="f" style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" name="tersedia" ${m.tersedia?'checked':''}> Tersedia hari ini</label>`,
  fd=>{
    const d={nama:fd.get('nama').trim(),kategori:fd.get('kategori'),harga:+fd.get('harga')||0,emoji:fd.get('emoji').trim(),deskripsi:fd.get('deskripsi').trim(),badge:fd.get('badge').trim(),image:fd.get('image').trim(),image_alt:fd.get('nama').trim(),tersedia:fd.get('tersedia')==='on'};
    if(!d.nama){toast('Nama menu wajib diisi');return false}
    run(id?sb.from('menu').update(d).eq('id',id):sb.from('menu').insert(d),id?'Menu diperbarui':'Menu ditambahkan');
  });
}
function toggleMenu(id){const m=S.menu.find(x=>x.id===id);run(sb.from('menu').update({tersedia:!m.tersedia}).eq('id',id),m.tersedia?'Menu ditandai habis':'Menu tersedia')}
function delMenu(id){const m=S.menu.find(x=>x.id===id);ask(`Hapus menu "${m.nama}"?`,()=>run(sb.from('menu').delete().eq('id',id),'Menu dihapus'))}

/* ---------- pesanan ---------- */
function vOrders(){
  const list=S.orders.filter(o=>ofilter==='Semua'||o.status===ofilter);
  return `
  <div class="head"><div><h2>Pesanan</h2><p>Pesanan dari website dan yang dicatat manual.</p></div>
    <button class="btn" onclick="orderForm()">Catat pesanan</button></div>
  <div class="chips">${['Semua',...STATUS].map(c=>`<button class="chip" aria-pressed="${ofilter===c}" onclick="ofilter='${c}';render()">${c}${c==='Semua'?'':' ('+S.orders.filter(o=>o.status===c).length+')'}</button>`).join('')}</div>
  <div class="panel">${list.length?list.map(o=>`
    <div class="ord">
      <div class="top"><div><b>${esc(o.kode)}</b> · ${esc(o.nama)} <span class="badge b-${o.status}">${o.status}</span> <span class="src">${o.sumber==='web'?'Website':'Manual'}</span></div><b>${rp(o.total)}</b></div>
      <div>${(o.items||[]).map(i=>`${i.qty}× ${esc(i.nama)}`).join(', ')}</div>
      <div class="meta">${esc(o.tipe)} · ${fmtTime(o.created_at)}${o.catatan?' · Catatan: '+esc(o.catatan):''}</div>
      <div class="acts" style="justify-content:flex-start">
        <select style="width:auto" aria-label="Status pesanan ${esc(o.kode)}" onchange="setStatus('${o.id}',this.value)">${STATUS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select>
        ${o.wa?`<a class="btn ghost sm" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${waNum(o.wa)}?text=${encodeURIComponent(`Halo ${o.nama}, pesanan ${o.kode} di ${S.warung.nama||'warung kami'} berstatus: ${o.status}. Terima kasih.`)}">Kabari lewat WhatsApp</a>`:''}
        <button class="btn ghost sm" onclick="delOrder('${o.id}')">Hapus</button>
      </div>
    </div>`).join(''):`<div class="empty"><b>Belum ada pesanan</b>Pesanan yang masuk akan muncul di sini.</div>`}</div>`;
}
function orderForm(){
  const avail=S.menu.filter(m=>m.tersedia);
  if(!avail.length){toast('Belum ada menu yang tersedia');return}
  modal('Catat pesanan',`
    <div class="row2">
      <label class="f">Nama pemesan<input type="text" name="nama" required></label>
      <label class="f">Nomor WhatsApp<input type="tel" name="wa" placeholder="08xxxxxxxxxx"></label>
    </div>
    <label class="f">Jenis pesanan<select name="tipe"><option>Dine-in</option><option>Take-away</option></select></label>
    <div class="f" style="margin-bottom:6px">Pilih menu</div>
    ${avail.map(m=>`<div class="qty"><div>${esc(m.emoji)} ${esc(m.nama)}<div class="hint">${rp(m.harga)}</div></div><input type="number" min="0" value="0" name="q_${m.id}" aria-label="Jumlah ${esc(m.nama)}"></div>`).join('')}
    <label class="f" style="margin-top:12px">Catatan<textarea name="catatan" placeholder="Contoh: tanpa sawi, pedas"></textarea></label>
    <div class="total"><span>Total</span><span id="oTotal">Rp 0</span></div>`,
  fd=>{
    const items=avail.map(m=>({id:m.id,nama:m.nama,harga:m.harga,qty:Math.max(0,parseInt(fd.get('q_'+m.id))||0)})).filter(i=>i.qty>0);
    if(!items.length){toast('Pilih minimal satu menu');return false}
    ofilter='Semua';view='orders';
    run(sb.from('orders').insert({nama:fd.get('nama').trim(),wa:fd.get('wa').trim(),tipe:fd.get('tipe'),catatan:fd.get('catatan').trim(),items,total:items.reduce((a,i)=>a+i.harga*i.qty,0),status:'Baru',sumber:'admin'}),'Pesanan dicatat');
  },'Simpan pesanan',()=>{
    dlgForm.addEventListener('input',()=>{let t=0;avail.forEach(m=>{t+=m.harga*Math.max(0,parseInt(dlgForm.elements['q_'+m.id].value)||0)});$('#oTotal').textContent=rp(t)});
  });
}
function setStatus(id,s){run(sb.from('orders').update({status:s}).eq('id',id),'Status diubah ke '+s)}
function delOrder(id){const o=S.orders.find(x=>x.id===id);ask(`Hapus pesanan ${o.kode}?`,()=>run(sb.from('orders').delete().eq('id',id),'Pesanan dihapus'))}

/* ---------- testimoni ---------- */
function vTesti(){
  return `
  <div class="head"><div><h2>Testimoni</h2><p>Testimoni dari website masuk dengan status Menunggu. Hanya yang berstatus Tampil yang terlihat pengunjung.</p></div>
    <button class="btn" onclick="testiForm()">Tambah testimoni</button></div>
  <div class="panel">${S.testi.length?S.testi.map(t=>`
    <div class="ord">
      <div class="top"><div><b>${esc(t.nama)}</b> <span class="hint">${esc(t.peran||'')}</span> <span class="badge b-${t.status}">${t.status}</span></div><span class="stars" aria-label="${t.rating} bintang">${'★'.repeat(t.rating)}${'☆'.repeat(5-t.rating)}</span></div>
      <div>${esc(t.isi)}</div>
      <div class="acts" style="justify-content:flex-start">
        ${t.status!=='Tampil'?`<button class="btn sm" onclick="setTesti('${t.id}','Tampil')">Tampilkan</button>`:''}
        ${t.status!=='Disembunyikan'?`<button class="btn ghost sm" onclick="setTesti('${t.id}','Disembunyikan')">Sembunyikan</button>`:''}
        <button class="btn ghost sm" onclick="delTesti('${t.id}')">Hapus</button>
      </div>
    </div>`).join(''):`<div class="empty"><b>Belum ada testimoni</b>Tambahkan testimoni atau tunggu kiriman dari website.</div>`}</div>`;
}
function testiForm(){
  modal('Tambah testimoni',`
    <div class="row2">
      <label class="f">Nama pelanggan<input type="text" name="nama" required maxlength="60"></label>
      <label class="f">Keterangan<input type="text" name="peran" placeholder="Pelanggan Setia"></label>
    </div>
    <label class="f">Rating<select name="rating">${[5,4,3,2,1].map(n=>`<option value="${n}">${n} bintang</option>`).join('')}</select></label>
    <label class="f">Isi testimoni<textarea name="isi" required minlength="5" maxlength="600"></textarea></label>`,
  fd=>{run(sb.from('testimoni').insert({nama:fd.get('nama').trim(),peran:fd.get('peran').trim(),rating:+fd.get('rating'),isi:fd.get('isi').trim(),status:'Tampil'}),'Testimoni ditambahkan')});
}
function setTesti(id,s){run(sb.from('testimoni').update({status:s}).eq('id',id),s==='Tampil'?'Testimoni ditampilkan':'Testimoni disembunyikan')}
function delTesti(id){ask('Hapus testimoni ini?',()=>run(sb.from('testimoni').delete().eq('id',id),'Testimoni dihapus'))}

/* ---------- pengaturan ---------- */
function vSet(){
  const w=S.warung;
  return `
  <div class="head"><div><h2>Pengaturan</h2><p>Informasi warung dan akun admin.</p></div></div>
  <div class="panel pad">
    <h3>Informasi warung</h3>
    <label class="f">Nama warung<input type="text" id="s_nama" value="${esc(w.nama)}"></label>
    <div class="row2">
      <label class="f">Nomor WhatsApp<input type="tel" id="s_wa" value="${esc(w.wa)}"></label>
      <label class="f">Alamat<input type="text" id="s_alamat" value="${esc(w.alamat)}"></label>
    </div>
    <div class="row2">
      <label class="f">Jam buka Senin sampai Sabtu<input type="text" id="s_sen" value="${esc(w.jam_sen_sab)}"></label>
      <label class="f">Jam buka Minggu<input type="text" id="s_min" value="${esc(w.jam_minggu)}"></label>
    </div>
    <button class="btn" onclick="saveWarung()">Simpan informasi</button>
  </div>
  <div class="panel pad" style="margin-top:16px">
    <h3>Ganti kata sandi</h3>
    <div class="row2">
      <label class="f">Kata sandi baru<input type="password" id="p1" autocomplete="new-password"></label>
      <label class="f">Ulangi kata sandi baru<input type="password" id="p2" autocomplete="new-password"></label>
    </div>
    <button class="btn" onclick="savePw()">Ganti kata sandi</button>
  </div>`;
}
function saveWarung(){
  run(sb.from('warung').upsert({id:1,nama:$('#s_nama').value.trim(),wa:$('#s_wa').value.trim(),alamat:$('#s_alamat').value.trim(),jam_sen_sab:$('#s_sen').value.trim(),jam_minggu:$('#s_min').value.trim()}),'Informasi warung disimpan');
}
async function savePw(){
  const a=$('#p1').value,b=$('#p2').value;
  if(a.length<8){toast('Kata sandi minimal 8 karakter');return}
  if(a!==b){toast('Kedua kata sandi harus sama');return}
  const {error}=await sb.auth.updateUser({password:a});
  if(error){toast('Gagal: '+error.message);return}
  $('#p1').value='';$('#p2').value='';toast('Kata sandi diganti');
}

/* ---------- mulai ---------- */
(async function boot(){
  if(!configured){showLogin();return}
  const {data}=await sb.auth.getSession();
  if(data.session)await enter();else showLogin();
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ready)showLogin()});
})();
</script>
</body>
</html>
